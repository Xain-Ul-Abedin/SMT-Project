name: SMT-Project CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: Code Quality & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Documentation & Schema Files
        run: |
          echo "Checking SRS and README files..."
          test -f README.md
          test -f SRS.md || test -f docs/SRS.md
          echo "Documentation verification passed."

  build-containers:
    name: Build & Verify Multi-Container Orchestration
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
          echo "Docker compose configuration is valid."

  deploy-preview:
    name: Deployment Preview Trigger
    runs-on: ubuntu-latest
    needs: build-containers
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deployment Signal
        run: |
          echo "Continuous Deployment Pipeline Triggered for Public Repository SMT-Project."
